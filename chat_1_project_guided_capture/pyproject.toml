[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "mrea-chat1-capture"
version = "0.1.0"
description = "MREA Chat 1 Project & Guided Capture domain baseline"
requires-python = ">=3.12"
dependencies = [
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
vision = [
  "numpy>=2,<3",
  "opencv-contrib-python-headless>=4.13,<5",
]
test = [
  "pytest>=8,<10",
  "jsonschema>=4.23,<5",
  "numpy>=2,<3",
  "opencv-contrib-python-headless>=4.13,<5",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
