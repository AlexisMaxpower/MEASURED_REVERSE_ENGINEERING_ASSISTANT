name: MREA Round 4 Truth CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
      - integration/pass-4-candidate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrea-round4-truth-${{ github.ref }}
  cancel-in-progress: true

jobs:
  shared-gate-infrastructure:
    name: Round 4 / Shared gate infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile Round 4 shared integration tests
        run: |
          python -m py_compile \
            tests/integration/test_round4_chat1_to_chat2_truth.py \
            tests/integration/test_round4_chat2_to_chat3_truth.py \
            tests/integration/test_round4_chat3_to_chat4_truth.py \
            tests/integration/test_round4_chat4_to_chat5_truth.py \
            tests/integration/test_round4_golden_path.py

  round4-chat1-chat2:
    name: Integration / Round 4 Chat 1 -> Chat 2 truth
    if: github.ref == 'refs/heads/integration/pass-4-candidate' || (github.event_name == 'pull_request' && github.head_ref == 'integration/pass-4-candidate')
    needs:
      - shared-gate-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_1_project_guided_capture/pyproject.toml
            chat_2_physical_measurement/pyproject.toml
      - name: Install Round 4 Capture -> Measurement environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./chat_1_project_guided_capture[test]" -e "./chat_2_physical_measurement[test]"
      - name: Run Round 4 recapture-lineage boundary gate
        run: python -m pytest -q tests/integration/test_round4_chat1_to_chat2_truth.py

  round4-chat2-chat3:
    name: Integration / Round 4 Chat 2 -> Chat 3 truth
    if: github.ref == 'refs/heads/integration/pass-4-candidate' || (github.event_name == 'pull_request' && github.head_ref == 'integration/pass-4-candidate')
    needs:
      - shared-gate-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_2_physical_measurement/pyproject.toml
            chat_3_geometry_semi_automatic_sketch/pyproject.toml
      - name: Install Round 4 Measurement -> Geometry environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./chat_2_physical_measurement[test]" -e "./chat_3_geometry_semi_automatic_sketch[test]"
      - name: Run Round 4 anchor-unit-uncertainty boundary gate
        run: python -m pytest -q tests/integration/test_round4_chat2_to_chat3_truth.py

  round4-chat3-chat4:
    name: Integration / Round 4 Chat 3 -> Chat 4 truth
    if: github.ref == 'refs/heads/integration/pass-4-candidate' || (github.event_name == 'pull_request' && github.head_ref == 'integration/pass-4-candidate')
    needs:
      - shared-gate-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_3_geometry_semi_automatic_sketch/pyproject.toml
            chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Install Round 4 Geometry -> CAD environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./chat_3_geometry_semi_automatic_sketch[test]"
          python -m pip install -r chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Run Round 4 constraint-residual boundary gate
        env:
          PYTHONPATH: chat_4_cad_bridge_verification/src
        run: python -m pytest -q tests/integration/test_round4_chat3_to_chat4_truth.py

  round4-chat4-chat5:
    name: Integration / Round 4 Chat 4 -> Chat 5 truth
    if: github.ref == 'refs/heads/integration/pass-4-candidate' || (github.event_name == 'pull_request' && github.head_ref == 'integration/pass-4-candidate')
    needs:
      - shared-gate-infrastructure
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Install Round 4 CAD -> Lifecycle environment
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Run Round 4 runtime-status lifecycle boundary gate
        env:
          PYTHONPATH: chat_4_cad_bridge_verification/src:chat_5_lifecycle_engineering_knowledge/src
        run: python -m pytest -q tests/integration/test_round4_chat4_to_chat5_truth.py

  round4-golden-path:
    name: Integration / Round 4 golden path
    if: github.ref == 'refs/heads/integration/pass-4-candidate' || (github.event_name == 'pull_request' && github.head_ref == 'integration/pass-4-candidate')
    needs:
      - round4-chat1-chat2
      - round4-chat2-chat3
      - round4-chat3-chat4
      - round4-chat4-chat5
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_1_project_guided_capture/pyproject.toml
            chat_2_physical_measurement/pyproject.toml
            chat_3_geometry_semi_automatic_sketch/pyproject.toml
            chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Install Round 4 golden-path environment
        run: |
          python -m pip install --upgrade pip pytest "jsonschema>=4.23,<5"
          python -m pip install -e "./chat_1_project_guided_capture[test]"
          python -m pip install -e "./chat_2_physical_measurement[test]"
          python -m pip install -e "./chat_3_geometry_semi_automatic_sketch[test]"
          python -m pip install -r chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Run Round 4 truth-hardening golden path
        env:
          PYTHONPATH: chat_4_cad_bridge_verification/src:chat_5_lifecycle_engineering_knowledge/src
        run: python -m pytest -q tests/integration/test_round4_golden_path.py
