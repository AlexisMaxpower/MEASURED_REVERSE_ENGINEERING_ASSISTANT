name: MREA CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - "chat-*/pass-*"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mrea-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  contracts:
    name: Contracts / canonical fixtures
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install contract test dependencies
        run: python -m pip install --upgrade pip pytest "jsonschema>=4.23,<5"
      - name: Validate canonical contracts and fixture chain
        run: python -m pytest -q tests/contracts

  chat1:
    name: Chat 1 / Capture
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat_1_project_guided_capture/pyproject.toml
      - name: Install Chat 1 test environment
        working-directory: chat_1_project_guided_capture
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Chat 1 tests
        working-directory: chat_1_project_guided_capture
        run: python -m pytest -q

  chat2:
    name: Chat 2 / Measurement
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat_2_physical_measurement/pyproject.toml
      - name: Install Chat 2 test environment
        working-directory: chat_2_physical_measurement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Chat 2 tests
        working-directory: chat_2_physical_measurement
        run: python -m pytest -q

  chat3:
    name: Chat 3 / Geometry
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat_3_geometry_semi_automatic_sketch/pyproject.toml
      - name: Install Chat 3 test environment
        working-directory: chat_3_geometry_semi_automatic_sketch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - name: Run Chat 3 tests
        working-directory: chat_3_geometry_semi_automatic_sketch
        run: python -m pytest -q

  chat4:
    name: Chat 4 / Generic CAD gate
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_4_cad_bridge_verification/requirements.txt
            chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Install Chat 4 test environment
        working-directory: chat_4_cad_bridge_verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - name: Run Chat 4 tests
        working-directory: chat_4_cad_bridge_verification
        env:
          PYTHONPATH: src
        run: python -m unittest discover -s tests -v

  chat5:
    name: Chat 5 / Lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install Chat 5 test environment
        run: python -m pip install --upgrade pip pytest
      - name: Run Chat 5 tests
        working-directory: chat_5_lifecycle_engineering_knowledge
        env:
          PYTHONPATH: src
        run: python -m pytest -q

  integration-chat2-chat3:
    name: Integration / Chat 2 -> Chat 3
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/chat-3/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - contracts
      - chat2
      - chat3
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            chat_2_physical_measurement/pyproject.toml
            chat_3_geometry_semi_automatic_sketch/pyproject.toml
      - name: Install cross-slice test environment
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./chat_2_physical_measurement[test]" -e "./chat_3_geometry_semi_automatic_sketch[test]"
      - name: Run real Measurement -> Geometry boundary gate
        run: python -m pytest -q tests/integration/test_chat2_to_chat3_boundary.py

  integration-chat4-chat5:
    name: Integration / Chat 4 -> Chat 5
    if: (github.event_name == 'pull_request' && startsWith(github.head_ref, 'chat-5/')) || startsWith(github.ref, 'refs/heads/chat-5/')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    needs:
      - contracts
      - chat4
      - chat5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Install cross-slice test environment
        run: |
          python -m pip install --upgrade pip pytest
          python -m pip install -r chat_4_cad_bridge_verification/requirements-dev.txt
      - name: Run real CAD -> Lifecycle boundary gate
        env:
          PYTHONPATH: chat_4_cad_bridge_verification/src:chat_5_lifecycle_engineering_knowledge/src
        run: python -m pytest -q tests/integration/test_chat4_to_chat5_boundary.py
