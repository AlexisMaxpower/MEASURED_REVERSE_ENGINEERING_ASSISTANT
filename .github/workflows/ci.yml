name: MREA CI
on:
  pull_request:
    branches: [main]
  push:
    branches: ["chat-*/pass-*"]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: mrea-ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  contracts:
    name: Contracts / canonical fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --upgrade pip pytest "jsonschema>=4.23,<5"
      - run: python -m pytest -q tests/contracts
  chat1:
    name: Chat 1 / Capture
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: chat_1_project_guided_capture/pyproject.toml}
      - working-directory: chat_1_project_guided_capture
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - working-directory: chat_1_project_guided_capture
        run: python -m pytest -q
  chat2:
    name: Chat 2 / Measurement
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: chat_2_physical_measurement/pyproject.toml}
      - working-directory: chat_2_physical_measurement
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - working-directory: chat_2_physical_measurement
        run: python -m pytest -q
  chat3:
    name: Chat 3 / Geometry
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: chat_3_geometry_semi_automatic_sketch/pyproject.toml}
      - working-directory: chat_3_geometry_semi_automatic_sketch
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[test]"
      - working-directory: chat_3_geometry_semi_automatic_sketch
        run: python -m pytest -q
  chat4:
    name: Chat 4 / Generic CAD gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: chat_4_cad_bridge_verification/requirements-dev.txt}
      - working-directory: chat_4_cad_bridge_verification
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
      - working-directory: chat_4_cad_bridge_verification
        env: {PYTHONPATH: src}
        run: python -m unittest discover -s tests -v
  chat5:
    name: Chat 5 / Lifecycle
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: python -m pip install --upgrade pip pytest
      - working-directory: chat_5_lifecycle_engineering_knowledge
        env: {PYTHONPATH: src}
        run: python -m pytest -q
  integration-chat2-chat3:
    name: Integration / Chat 2 -> Chat 3
    if: github.event_name == 'pull_request' || startsWith(github.ref, 'refs/heads/chat-3/')
    runs-on: ubuntu-latest
    needs: [contracts, chat2, chat3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip, cache-dependency-path: chat_3_geometry_semi_automatic_sketch/pyproject.toml}
      - run: |
          python -m pip install --upgrade pip
          python -m pip install -e "./chat_2_physical_measurement[test]" -e "./chat_3_geometry_semi_automatic_sketch[test]"
      - run: python -m pytest -q tests/integration/test_chat2_to_chat3_boundary.py
